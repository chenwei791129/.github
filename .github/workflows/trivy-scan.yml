name: Trivy Scan

# Shared Trivy scan for all repositories under this account. Callers invoke it
# with `uses:` so the pinned action SHAs live in exactly one place — bumping
# Trivy here upgrades every caller on its next run.
#
# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA (not a floating tag) so a compromised/retagged release cannot be pulled
# into the runner. The trailing comment records the human-readable version that
# SHA corresponds to. When bumping, re-resolve the SHA from the upstream tag
# (e.g. `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`).
on:
  workflow_call:
    inputs:
      scan-type:
        description: 'Trivy scan type: fs, image, repo, rootfs, config or sbom'
        required: false
        type: string
        default: fs
      scan-ref:
        description: 'Scan target: a path for fs/config, an image reference for image'
        required: false
        type: string
        default: '.'
      scanners:
        description: 'Comma-separated scanners: vuln, secret, misconfig, license'
        required: false
        type: string
        default: vuln
      severity:
        description: 'Comma-separated severities to report'
        required: false
        type: string
        default: HIGH,CRITICAL
      exit-code:
        description: 'Exit code of the gating scan; "0" reports without failing the job'
        required: false
        type: string
        default: '1'
      upload-sarif:
        description: >-
          Run an extra non-failing pass and upload SARIF to the Security tab.
          Requires `security-events: write` on the calling job, and GitHub
          Advanced Security on private repositories.
        required: false
        type: boolean
        default: false
      category:
        description: >-
          SARIF analysis category, used only by the SARIF upload; empty uses
          trivy-<scan-type>. Set distinct values whenever the same scan type
          uploads more than once in a repository, including from different
          workflows.
        required: false
        type: string
        default: ''
      runs-on:
        description: 'Runner label for the scan job'
        required: false
        type: string
        default: ubuntu-26.04

jobs:
  trivy:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First pass: produce SARIF without failing the job, so results always
      # reach the Security tab even when vulnerabilities are present.
      - name: Trivy scan (SARIF report)
        if: inputs.upload-sarif
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          scanners: ${{ inputs.scanners }}
          severity: ${{ inputs.severity }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload SARIF to Security tab
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-results.sarif
          category: ${{ inputs.category || format('trivy-{0}', inputs.scan-type) }}

      # Second pass: gate the build. Reuses Trivy's cache from the first pass,
      # so this is fast. The table is written to a file so the summary step can
      # publish it, and echoed back to the log so the log stays readable.
      - name: Trivy scan (gating)
        id: gating
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          scanners: ${{ inputs.scanners }}
          severity: ${{ inputs.severity }}
          format: table
          output: trivy-gating.txt
          exit-code: ${{ inputs.exit-code }}

      - name: Write job summary
        if: ${{ always() && steps.gating.outcome != 'skipped' }}
        env:
          GATING_OUTCOME: ${{ steps.gating.outcome }}
          SCAN_TYPE: ${{ inputs.scan-type }}
          SCAN_REF: ${{ inputs.scan-ref }}
          SCANNERS: ${{ inputs.scanners }}
          SEVERITY: ${{ inputs.severity }}
          UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        run: |
          if [[ -f trivy-gating.txt ]]; then
            cat trivy-gating.txt
          fi
          {
            echo "## Trivy scan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Result | ${GATING_OUTCOME} |"
            echo "| Scan type | \`${SCAN_TYPE}\` |"
            echo "| Target | \`${SCAN_REF}\` |"
            echo "| Scanners | \`${SCANNERS}\` |"
            echo "| Severity | \`${SEVERITY}\` |"
            if [[ "${UPLOAD_SARIF}" == "true" && -f trivy-results.sarif ]]; then
              echo "| SARIF findings | $(jq '[.runs[].results[]] | length' trivy-results.sarif) (uploaded to Security tab) |"
            fi
            echo
            if [[ -s trivy-gating.txt ]]; then
              echo "<details><summary>Report</summary>"
              echo
              echo '```'
              cat trivy-gating.txt
              echo '```'
              echo
              echo "</details>"
            else
              echo "No findings at the configured severity."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
